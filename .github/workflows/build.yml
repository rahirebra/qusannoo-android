name: Build Qusannoo Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        node-version: '24'  # Use Node.js 24
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Grant execute permission for gradlew
      run: chmod +x android-app/gradlew
    
    - name: Build Debug APK
      run: |
        cd android-app
        ./gradlew assembleDebug
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Qusannoo-Debug
        path: android-app/app/build/outputs/apk/debug/*.apk
        retention-days: 30
    
    - name: Build Release APK
      run: |
        cd android-app
        ./gradlew assembleRelease
      continue-on-error: true
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Qusannoo-Release
        path: android-app/app/build/outputs/apk/release/*.apk
        retention-days: 30
      continue-on-error: true
    
    - name: Build AAB Bundle
      run: |
        cd android-app
        ./gradlew bundleRelease
      continue-on-error: true
    
    - name: Upload AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: Qusannoo-AAB
        path: android-app/app/build/outputs/bundle/release/*.aab
        retention-days: 30
      continue-on-error: true
